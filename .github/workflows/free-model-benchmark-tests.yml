name: Free model benchmark safety tests
on:
  pull_request:
    paths:
      - 'experiments/free_model_benchmark.py'
      - 'tests/test_free_model_benchmark.py'
      - '.github/workflows/free-model-benchmark-tests.yml'
  workflow_dispatch:
jobs:
  safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline safety tests (no API keys required)
        run: python -m unittest discover -s tests -p 'test_free_model_benchmark.py' -v
